name: nolviko
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-nolviko}
      DB_USERNAME: ${DB_USERNAME:-nolviko}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - ./public:/var/www/html/public:ro
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nolviko}
      MYSQL_USER: ${DB_USERNAME:-nolviko}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      start_period: 40s
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  # MariaDB 10.11 LTS, the lowest supported MariaDB: the Integration suite runs here too. Test data only, so it
  # lives in memory and is not reachable from the host.
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-nolviko}
      MARIADB_USER: ${DB_USERNAME:-nolviko}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_520_ci", "--default-time-zone=+00:00"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  # PostgreSQL 16 (2026-11-14): the Integration suite runs here too (FORUM_TEST_DB_DRIVER=postgresql). Test data
  # only, in memory, not reachable from the host.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nolviko}
      POSTGRES_USER: ${DB_USERNAME:-nolviko}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-data:
  storage: