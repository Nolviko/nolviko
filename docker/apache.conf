ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
        # Same static-file caching as public/.htaccess (AllowOverride None here).
        <FilesMatch "\.[a-f0-9]{64}\.(css|js)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "\.(css|js|woff2)$">
            Header setifempty Cache-Control "public, max-age=86400"
        </FilesMatch>
    </Directory>
    # PHP responses carry the full policy (SecurityHeaders, M01.07: CSP nonce, Permissions-Policy, HSTS).
    # These cover responses Apache answers itself (denied files, 403/404) without duplicating PHP's headers.
    Header always set X-Content-Type-Options "nosniff" "expr=-z resp('X-Content-Type-Options')"
    Header always set Referrer-Policy "strict-origin-when-cross-origin" "expr=-z resp('Referrer-Policy')"
    Header always set X-Frame-Options "DENY" "expr=-z resp('X-Frame-Options')"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" "expr=-z resp('Content-Security-Policy')"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
